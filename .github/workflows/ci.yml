name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run rather than queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 to match backend/Dockerfile (node:20-alpine), so CI exercises
      # the same runtime as production rather than whatever is newest.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` fails if package.json and the lockfile have drifted — the same
      # check the Docker build depends on.
      - name: Install
        working-directory: backend
        run: npm ci

      # The suites stub the database, enkaService and auth, and feed
      # googleRanges a fixture, so this needs no secrets and no egress.
      - name: Test
        working-directory: backend
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Catches broken imports and syntax before a deploy does. Lint is
      # deliberately NOT run here: the existing code has ~150 pre-existing
      # violations, so it would fail from day one and train everyone to ignore
      # a red badge. Worth enabling once those are cleared.
      - name: Build
        working-directory: frontend
        run: npm run build
